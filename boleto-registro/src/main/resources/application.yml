server:
  port: 8082

spring:
  application:
    name: boleto-registro
  artemis:
    mode: native
    broker-url: ${BROKER_URL:tcp://127.0.0.1:61616?blockOnDurableSend=true&callTimeout=2000&initialConnectAttempts=1&reconnectAttempts=0}
  # Base H2 PROPRIA do registro (dono do estado do titulo).
  datasource:
    url: ${REGISTRO_DB_URL:jdbc:h2:file:./data/registro;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  jackson:
    property-naming-strategy: SNAKE_CASE

registro:
  mensageria:
    enabled: ${REGISTRO_MENSAGERIA_ENABLED:true}
  http-comandos:
    enabled: false
  simulacao:
    cenario: ${REGISTRADORA_CENARIO:APROVAR}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.apache.activemq.audit: "OFF"
