server:
  port: 8082

spring:
  application:
    name: boleto-registro
  # Base H2 PROPRIA do registro (dono do estado do titulo).
  datasource:
    url: jdbc:h2:mem:registro;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
