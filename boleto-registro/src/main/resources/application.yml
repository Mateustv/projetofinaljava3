server:
  port: 8082

spring:
  application:
    name: boleto-registro
  # Base H2 PROPRIA do registro (dono do estado do titulo).
  datasource:
    url: ${REGISTRO_DB_URL:jdbc:h2:file:./data/registro;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health,info
