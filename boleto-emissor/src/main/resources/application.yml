server:
  port: 8081

spring:
  application:
    name: boleto-emissor
  # Base H2 PROPRIA do emissor (nenhum outro servico acessa esta base).
  datasource:
    url: jdbc:h2:mem:emissor;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    # JSON do contrato em snake_case (numero_controle_cliente, valor_nominal...)
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health,info
