server:
  port: 8081

spring:
  application:
    name: boleto-emissor
  # Base H2 PROPRIA do emissor (nenhum outro servico acessa esta base).
  datasource:
    url: ${EMISSOR_DB_URL:jdbc:h2:file:./data/emissor;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    # JSON do contrato em snake_case (numero_controle_cliente, valor_nominal...)
    property-naming-strategy: SNAKE_CASE

integracao:
  registro:
    url: ${REGISTRO_URL:http://localhost:8082}

emissao:
  outbox:
    dispatch:
      enabled: ${OUTBOX_DISPATCH_ENABLED:true}
      interval-ms: ${OUTBOX_DISPATCH_INTERVAL_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
