server:
  port: 8083

spring:
  application:
    name: boleto-consulta
  artemis:
    mode: native
    broker-url: ${BROKER_URL:tcp://127.0.0.1:61616?blockOnDurableSend=true&callTimeout=2000&initialConnectAttempts=1&reconnectAttempts=0}
  jackson:
    property-naming-strategy: SNAKE_CASE

integracoes:
  registro:
    base-url: http://localhost:8082
  emissor:
    base-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

consulta:
  eventos:
    enabled: ${CONSULTA_EVENTOS_ENABLED:true}

logging:
  level:
    org.apache.activemq.audit: "OFF"
